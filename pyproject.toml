[project]
name = "opensource-copilot"
version = "0.1.0"
description = "Knowledge-graph + HybridRAG + Agent copilot that helps developers onboard onto open-source projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI-KM Course · Group X" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "neo4j>=5.23.0",
    "pymilvus>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pyyaml>=6.0.2",
    "openai>=1.40.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.43.0",
    "tiktoken>=0.7.0",
    "networkx>=3.3",
    "torch>=2.3.0",
    "torch-geometric>=2.5.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-languages>=1.10.2",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "rank-bm25>=0.2.2",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
