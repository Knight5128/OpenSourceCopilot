[project]
name = "opensource-copilot"
version = "0.1.0"
description = "Knowledge-graph + HybridRAG + Agent copilot that helps developers onboard onto open-source projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI-KM Course · Group X" },
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
